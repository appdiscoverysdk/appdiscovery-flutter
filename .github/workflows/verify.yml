# Verifies this package as published: static analysis and tests, and a build of
# the example app for Android and iOS (the example depends on this package).
# Runs on every push and on demand; free on a public repository.

name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate the example's platform folders
        working-directory: example
        run: flutter create --platforms=android --project-name appdiscovery_sdk_example --org com.example .
      - name: Build the example app
        working-directory: example
        run: flutter build apk --debug

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate the example's platform folders
        working-directory: example
        run: flutter create --platforms=ios --project-name appdiscovery_sdk_example --org com.example .
      - name: Build the example app (simulator)
        working-directory: example
        run: flutter build ios --simulator --no-codesign
